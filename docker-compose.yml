# =====================================================================
# LOCAL DEVELOPMENT ONLY (per spec O: compose is not for production).
# Production runs on Kuberns: one Next.js app service + one managed
# PostgreSQL service with private networking and persistent disk.
# =====================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: spis-postgres
    environment:
      POSTGRES_USER: spis
      POSTGRES_PASSWORD: spis_local_dev
      POSTGRES_DB: spis_school
    ports:
      - "5432:5432"
    volumes:
      - spis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spis -d spis_school"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: spis-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spis:spis_local_dev@db:5432/spis_school
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      # uploaded documents live outside the image
      - spis_uploads:/app/uploads

volumes:
  spis_pgdata:
  spis_uploads:
